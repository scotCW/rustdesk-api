name: ghcr

# Builds the API image (Dockerfile.ghcr) natively on amd64 and arm64 and publishes a
# multi-arch manifest to ghcr.io/scotcw/rustdesk-api using only the repository's GITHUB_TOKEN.

on:
  workflow_dispatch:
  push:
    branches:
      - 'scotcw/**'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/scotcw/rustdesk-api
  # Admin front-end (scotCW fork, branch scotcw/maintenance), pinned for reproducible builds.
  WEB_REPO: scotCW/rustdesk-api-web
  WEB_REF: 80817152c78914ef7819a94220d7671d69ccfe90
  # Web client served at /webclient/ (Unlicense), pinned the same way.
  WEBCLIENT_REPO: scotCW/webclient-v3
  WEBCLIENT_REF: cf3e8a1602c401e8a8e21df2e2e748e9a639115f

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.WEB_REPO }}
          ref: ${{ env.WEB_REF }}
          path: rustdesk-api-web

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.WEBCLIENT_REPO }}
          ref: ${{ env.WEBCLIENT_REF }}
          path: webclient-v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ghcr
          push: true
          provenance: false
          build-args: VERSION=${{ github.ref_name }}-${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch tags
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${{ github.sha }}" \
            "$IMAGE:${{ github.sha }}-amd64" \
            "$IMAGE:${{ github.sha }}-arm64"
          docker buildx imagetools inspect "$IMAGE:latest"
